name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgres://postgres:password@localhost/iot_monitoring
  JWT_SECRET: ci-test-secret

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Start Postgres
        run: docker compose up -d

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T db pg_isready -U postgres && break
            sleep 1
          done

      - name: Install sqlx-cli
        # Pinned to match the sqlx crate version in Cargo.toml -- sqlx-cli
        # latest (0.9.x) has historically required a newer rustc than this
        # repo has targeted; untested against the current toolchain.
        run: cargo install sqlx-cli --version "=0.8.6" --no-default-features --features postgres

      - name: Run migrations
        run: sqlx migrate run

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      - name: Unit tests
        run: cargo test --lib

      - name: Integration tests
        run: cargo test --test integration

  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
